key: flow.dictation
name: How a dictation happens
description: |-
  From holding the hotkey to text at the cursor — and the correction you make afterwards, which
  teaches the app a word and comes back round on the next dictation. Every step happens on your
  own Mac.
steps:
  - edge:
      from: device.macos
      to: typemeit.audio-capture
      payload: mic audio
    note: Only while the hotkey is held. A press shorter than 300 ms is a tap, and cancels.
  - edge:
      from: typemeit.audio-capture
      to: typemeit.transcriber
      payload: 16 kHz audio
    note: A take under 0.3 s, or one with nothing but silence in it, is dropped here.
  - edge:
      from: typemeit.transcriber
      to: typemeit.custom-word-matcher
      payload: raw transcript
    note: The model's own words, each with a score for how sure it was.
  - edge:
      from: typemeit.custom-word-matcher
      to: typemeit.post-processor
      payload: matched transcript
    note: Skipped when Apple Intelligence clean-up is off; the text goes straight to step 5.
  - edge:
      from: typemeit.post-processor
      to: typemeit.local-cleanup
      payload: cleaned draft
    note: An answer that looks like a rewrite, or has lost its opening words, is thrown away.
  - edge:
      from: typemeit.local-cleanup
      to: device.macos
      payload: final text
    note: Pasted at the cursor through the system clipboard, which is then put back.
  - edge:
      from: device.macos
      to: typemeit.read-back
      payload: field contents
    note: The field is watched for up to 90 seconds in case you fix something.
  - edge:
      from: typemeit.read-back
      to: typemeit.learned-words-json
      payload: corrected words
    note: Only names, products, projects, acronyms and technical terms are kept.
  - edge:
      from: typemeit.learned-words-json
      to: typemeit.custom-word-matcher
      payload: learned terms
    note: Returns to step 4. What the model misheard once is a spelling it recognises next time.
provenance:
  state: asserted
  source: human
  author: max
