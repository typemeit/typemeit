nodes:
  - key: typemeit
    kind: app
    name: type me it
    summary: Hold the hotkey, speak, release; the text is pasted where you were typing.
    description: |-
      A macOS menu-bar dictation app. Everything that turns your voice into text happens
      on your own Mac — the speech model, the grammar clean-up, the vocabulary it learns
      from your corrections.
      The only network traffic is three downloads from GitHub: the speech model once, and
      the update feed and new builds afterwards. Nothing is ever uploaded.
    provenance:
      source: human
      author: max

  - key: typemeit.audio-capture
    kind: component
    name: AudioCapture
    summary: Captures the mic while the hotkey is held.
    description: |-
      Owns the microphone connection.
      - opens the microphone you chose, or the system default
      - converts every buffer to 16 kHz mono, the format the speech model expects
      - holds the take in memory; releasing the hotkey ends the stream and hands it on
    provenance:
      source: human
      author: max

  - key: typemeit.custom-word-matcher
    kind: function
    name: CustomWordMatcher
    summary: Swaps in the words the speech model keeps getting wrong.
    description: |-
      One pure function, run on every dictation, before any model sees the text.
      - a run of words is replaced when its letters spell one of your terms exactly
      - or when it sounds close, is about the right length, and the speech model was unsure of it
      - a word the model was confident in is never replaced on sound alone, because "cat" and
        "cut" sound alike; it is passed on as a hint for the clean-up model to settle instead
      No state, no memory, one call.
    provenance:
      source: human
      author: max

  - key: typemeit.history-json
    kind: collection
    name: history.json
    summary: Every dictation, with what was heard and what was written.
    subtype: file
    meta:
      path: ~/Library/Application Support/TypeMeIt/history.json
      format: JSON, ISO-8601 dates, rewritten atomically after every change
      retention: capped by the history limit, 500 entries by default
    sample: |-
      [
        {
          "id": "6F1C2A84-0B3D-4E55-9A71-2C8D5E7F0A19",
          "timestamp": "2026-09-14T09:12:41Z",
          "transcript": "send the deck to Priya by Friday",
          "postProcessed": "Send the deck to Priya by Friday.",
          "postProcessRequested": true,
          "appName": "Mail",
          "windowTitle": "Re: Q3 handover",
          "durationMs": 4210,
          "transcribeMs": 380,
          "dictionaryFixes": 1
        }
      ]
    schema:
      lang: swift
      file: TypeMeIt/Store.swift
      lines: [4, 28]
      code: |-
        struct HistoryEntry: Codable, Identifiable, Sendable, Equatable {
            var id: UUID = UUID()
            var timestamp: Date
            var starred: Bool = false
            /// Engine output after local cleanup (custom words, fillers, normalisation).
            var transcript: String
            /// Apple Intelligence output; nil when off, skipped, rejected or failed.
            var postProcessed: String?
            var postProcessRequested: Bool
            var edited: String?
            var editedAt: Date?
            var durationMs: Int?
            /// Wall-clock time the speech engine took, in milliseconds.
            var transcribeMs: Int?
            /// Wall-clock time Apple Intelligence took, in milliseconds; nil when it was not requested.
            var postProcessMs: Int?
            var appId: String?
            var appName: String?
            var windowTitle: String?
            var dictionaryFixes: Int
            /// File name in `RecordingArchive.directory`; nil when audio was not kept.
            var recordingFile: String?

            var displayText: String { edited ?? postProcessed ?? transcript }
        }
    description: |-
      The app's own record of every dictation, kept on this Mac and nowhere else.
      - what the speech model heard, and the tidied version of it
      - which app and which window you dictated into
      - how long each stage took
      Personal data at rest: this is the file that holds what you said.
    provenance:
      source: human
      author: max

  - key: typemeit.history-json.edited
    kind: field
    name: edited
    summary: Your hand-edit of a dictation — which nothing in the shipped app writes.
    description: |-
      Meant to hold the version you corrected by hand, and it wins over everything else when a
      dictation is displayed. In the shipped app it is always empty: the three functions that
      would set it — `update`, `toggleStar` and `setEdited` — have no callers anywhere in the
      app, so nothing can ever fill it in.
    provenance:
      source: human
      author: max

  - key: typemeit.history-json.transcript
    kind: field
    name: transcript
    summary: What the speech model heard, exactly as it came out.
    description: |-
      The speech model's own output for a dictation, stored as it was produced — before the
      custom-word swap, the grammar clean-up and the filler stripping. It is therefore not the
      text that was pasted: no field holds that verbatim.
    provenance:
      source: human
      author: max

  - key: typemeit.history-json.window-title
    kind: field
    name: windowTitle
    summary: The title of the window you dictated into.
    description: |-
      The name of the window that had focus when you spoke — document names, chat participants,
      browser tab titles — stored exactly as the system reported it, never redacted. The sharpest
      personal data in the app: it records where you were, not just what you said.
    provenance:
      source: human
      author: max

  - key: typemeit.learned-words-json
    kind: collection
    name: learned-words.json
    summary: The words you corrected, remembered.
    subtype: file
    meta:
      path: ~/Library/Application Support/TypeMeIt/learned-words.json
      format: JSON, ISO-8601 dates, rewritten atomically after every change
      retention: no cap and no expiry; "Delete All" clears history and audio but not this file
    sample: |-
      [
        {
          "id": "1D77B0E4-9C2A-4B16-A3F8-0E5D6C817B24",
          "batchId": "8A4E1F62-33D9-4C07-B5EA-77C1029D4E8B",
          "heard": "para keet",
          "meant": "Parakey",
          "source": "readback",
          "learnedAt": "2026-09-14T09:13:02Z",
          "undone": false
        }
      ]
    schema:
      lang: swift
      file: TypeMeIt/Store.swift
      lines: [30, 39]
      code: |-
        struct LearnedWord: Codable, Identifiable, Sendable, Equatable {
            var id: UUID = UUID()
            var batchId: UUID
            var heard: String
            var meant: String
            var source: String
            var historyId: UUID?
            var learnedAt: Date
            var undone: Bool = false
        }
    description: |-
      Pairs of what the speech model wrote and what you meant, kept on this Mac.
      - most come from a correction you made right after a paste
      - some you typed yourself in settings, by naming the spelling the model keeps producing
      - undoing one marks it rather than deleting it, so it is never learned again
      Clearing your history does not clear this file, and nothing ever expires from it.
    tags:
      - retention-gap
    provenance:
      source: human
      author: max

  - key: typemeit.local-cleanup
    kind: function
    name: LocalCleanup
    summary: Tidies fillers and stutters, always.
    description: |-
      The mechanical half of clean-up, run on whatever is about to be typed.
      - drops filler sounds: "uh", "ummm", "erm"
      - collapses stutters, so "the the uh the" becomes one "the"
      - runs on the clean-up model's answer and on the raw transcript alike, because the model
        often leaves them in
      Same text in, same text out; nothing is stored.
    provenance:
      source: human
      author: max

  - key: typemeit.post-processor
    kind: component
    name: AI clean-up
    summary: Checks what the model sends back before trusting it.
    meta:
      guards: an answer that rewrites the text, or drops its opening words, is thrown away
    description: |-
      Decides whether the clean-up step runs at all, and whether its answer can be used.
      - an answer that reads like a rewrite, or that has lost the opening words, is discarded and
        the locally cleaned text is used instead
      - skipped entirely when the setting is off, when you press Escape, or when Apple
        Intelligence is unavailable
    tags:
      - on-device
    provenance:
      source: human
      author: max

  - key: typemeit.read-back
    kind: component
    name: Read-back learner
    summary: Watches the field you pasted into and learns your corrections.
    description: |-
      After a paste, it reads the text field back and compares what is there with what was put
      there, so a fix you make by hand can be turned into a word the app remembers.
      - it watches for up to 90 seconds, or until you move on
      - an on-device model decides whether a fix is a name, product, project, acronym or
        technical term — anything else is ignored as an ordinary edit
      - it never reads back from password managers or terminals, and never while the system is
        hiding what you type
    provenance:
      source: human
      author: max

  - key: typemeit.recordings
    kind: store
    name: Recordings
    summary: Raw takes, kept only if you ask for them.
    subtype: file
    meta:
      path: ~/Library/Application Support/TypeMeIt/Recordings/
      format: AAC in .m4a, mono, 16 kbps — roughly 120 KB a minute
      retention: deleted with the history entry it belongs to
    sample: |-
      6F1C2A84-0B3D-4E55-9A71-2C8D5E7F0A19.m4a · 4.2 s
      B2E90D17-5A6C-4F38-8D02-1E4A7B9C3F65.m4a · 11.8 s
    description: |-
      A folder of audio takes, one per dictation, written only when "keep audio" is on. It is off
      by default.
      - each file is named after the history entry it belongs to, and goes when that entry goes
      - a take can be played back beside its transcript in the history tab
      Your recorded voice at rest: the most sensitive thing the app stores.
    provenance:
      source: human
      author: max

  - key: typemeit.settings
    kind: store
    name: Settings
    summary: Your preferences.
    subtype: key-value
    meta:
      engine: UserDefaults, macOS's own preference store
      keys: microphoneUID, customWords, postProcessingEnabled, learnFromCorrections, keepRecordings, historyLimit, autoUpdate, askBeforeUpdating, undoneWords, screenContextEnabled, and 16 more
    sample: |-
      {
        "customWords": ["Parakey", "Zentryx", "Priya"],
        "postProcessingEnabled": true,
        "learnFromCorrections": true,
        "keepRecordings": false,
        "historyLimit": 500,
        "autoUpdate": true,
        "askBeforeUpdating": true
      }
    schema:
      lang: swift
      file: TypeMeIt/Settings.swift
      lines: [83, 133]
      code: |-
        var microphoneUID: String? { didSet { defaults.set(microphoneUID, forKey: "microphoneUID") } }
        var muteWhileRecording: Bool { didSet { defaults.set(muteWhileRecording, forKey: "muteWhileRecording") } }
        var audioFeedback: Bool { didSet { defaults.set(audioFeedback, forKey: "audioFeedback") } }
        var copyPromptEnabled: Bool { didSet { defaults.set(copyPromptEnabled, forKey: "copyPromptEnabled") } }
        var postProcessingEnabled: Bool { didSet { defaults.set(postProcessingEnabled, forKey: "postProcessingEnabled") } }
        var customWords: [String] { didSet { defaults.set(customWords, forKey: "customWords") } }
        var learnFromCorrections: Bool { didSet { defaults.set(learnFromCorrections, forKey: "learnFromCorrections") } }
        var appendTrailingSpace: Bool { didSet { defaults.set(appendTrailingSpace, forKey: "appendTrailingSpace") } }
        var autoSubmit: Bool { didSet { defaults.set(autoSubmit, forKey: "autoSubmit") } }
        var autoSubmitKey: AutoSubmitKey { didSet { defaults.set(autoSubmitKey.rawValue, forKey: "autoSubmitKey") } }
        var historyLimit: Int { didSet { defaults.set(historyLimit, forKey: "historyLimit") } }
        /// Keeps each dictation's audio next to its history entry.
        var keepRecordings: Bool { didSet { defaults.set(keepRecordings, forKey: "keepRecordings") } }
        /// Checks for, downloads and installs updates on its own. Off, the app
        /// looks for an update only when Settings comes to the front, and installs
        /// one only from the version row's button.
        var autoUpdate: Bool { didSet { defaults.set(autoUpdate, forKey: "autoUpdate") } }
        /// With `autoUpdate` on: a ready update is announced with the pill and
        /// waits for a click. Off, the app installs it and restarts itself once no
        /// dictation is in flight.
        var askBeforeUpdating: Bool { didSet { defaults.set(askBeforeUpdating, forKey: "askBeforeUpdating") } }
        var launchAtLogin: Bool { didSet { defaults.set(launchAtLogin, forKey: "launchAtLogin") } }
        var showDockIcon: Bool { didSet { defaults.set(showDockIcon, forKey: "showDockIcon") } }
        var appearance: Appearance { didSet { defaults.set(appearance.rawValue, forKey: "appearance") } }
        /// Off, the cloud is white or dark grey with the appearance.
        var cloudColorEnabled: Bool { didSet { defaults.set(cloudColorEnabled, forKey: "cloudColorEnabled") } }
        var cloudColor: CloudColor { didSet { defaults.set(cloudColor.rawValue, forKey: "cloudColor") } }
        var cloudPosition: CloudPosition { didSet { defaults.set(cloudPosition.rawValue, forKey: "cloudPosition") } }
        /// The cloud samples the screen under it and goes white or dark against
        /// it. Needs Screen Recording; without the grant the appearance decides.
        var cloudMatchesBackdrop: Bool { didSet { defaults.set(cloudMatchesBackdrop, forKey: "cloudMatchesBackdrop") } }
        /// The clean-up model is told the names and terms visible in the window
        /// being dictated into. Needs Screen Recording.
        var screenContextEnabled: Bool { didSet { defaults.set(screenContextEnabled, forKey: "screenContextEnabled") } }
        var onboardingComplete: Bool { didSet { defaults.set(onboardingComplete, forKey: "onboardingComplete") } }
        /// Copies the newest transcript to the clipboard. Nil means no shortcut.
        var copyLastShortcut: KeyCombo? {
            didSet { defaults.set(copyLastShortcut.flatMap { try? JSONEncoder().encode($0) }, forKey: "copyLastShortcut") }
        }
        /// Words removed by the learned-words toast's Undo. Never learned again.
        var undoneWords: [String] { didSet { defaults.set(undoneWords, forKey: "undoneWords") } }
        /// Writes what each dictation and paste did to `DebugLog.url`, naming
        /// the app, the clipboard's contents and the start of the transcript.
        /// For bug reports.
        var debugLogs: Bool {
            didSet {
                defaults.set(debugLogs, forKey: "debugLogs")
                DebugLog.enabled = debugLogs
                if debugLogs { DebugLog.writeHeader() }
            }
        }
    description: |-
      Everything you choose in the settings window, stored by macOS itself and written the moment
      you change it.
      - the words you want spelled your way, and which microphone to listen to
      - whether Apple Intelligence tidies your text, and whether corrections are learned
      - whether audio is kept, how much history to keep, and how updates install
      Your custom words are personal data: they are the names and jargon you use.
    provenance:
      source: human
      author: max

  - key: typemeit.transcriber
    kind: component
    name: Transcriber
    summary: Audio to raw text, on device.
    description: |-
      The heart of the app: the speech model, held in memory and run over the recording.
      - loads the 697 MB model on first use and frees it again after five idle minutes
      - runs on the Mac's GPU, falling back to the processor where that is not available
      - returns the text with a score for each word, saying how sure it was
      One dictation at a time, and nothing leaves the machine.
    provenance:
      source: human
      author: max

  - key: typemeit.transcriber.parakeet-gguf
    kind: artifact
    name: parakeet.gguf
    summary: The 697 MB speech model on disk.
    meta:
      path: ~/Library/Application Support/TypeMeIt/models/parakeet-unified-en-0.6b-Q8_0.gguf
      format: GGUF, Q8_0 quantised
      size: 697 MB (731,357,568 bytes)
      sha256: 4b50b6dd862bf6e346929aaf4f5eaacec003bfa3f56462d6c874b41ef2f38795
    description: |-
      The speech model as one quantised file. It is downloaded once while the app is being set
      up and checked against a size and a fingerprint the app ships with before it is put in
      place; a file that does not match is deleted rather than used. The app pins one exact
      model, so a newer one arrives only as a new version of the app.
    provenance:
      source: human
      author: max

  - key: typemeit.transcriber.transcribe
    kind: function
    name: transcribe
    summary: Runs the speech model over the recording.
    description: |-
      Feeds the 16 kHz audio through the model in a single pass and returns what it heard, word
      by word. One session at a time: a second dictation waits for the first, and pressing Escape
      aborts the run in progress.
    provenance:
      source: human
      author: max

  - key: typemeit.transcriber.word-scoring
    kind: function
    name: word scoring
    summary: Gives every word a score for how sure the model was.
    description: |-
      The model scores each piece of a word separately. This folds those into one number per
      word — the lowest of them, so a word is only ever as sure as its least certain part. The
      score is a hint rather than a calibrated probability, and it is what stops a word the model
      was confident in being swapped for one of your custom terms.
    provenance:
      source: human
      author: max

  - key: typemeit.updater
    kind: component
    name: Sparkle updater
    summary: Checks GitHub for new versions and installs them.
    description: |-
      Keeps the app up to date, using the Sparkle framework, and runs entirely apart from
      dictation.
      - checks for a new release hourly and when the app launches
      - downloads and installs on its own, or waits for your click, according to your preferences
      - waits for a dictation to finish before relaunching, so an update never cuts one off
      Nothing about your Mac is sent with the request, and development builds never check at all.
    provenance:
      source: human
      author: max

edges:
  - from: device.macos
    to: typemeit.audio-capture
    payload: mic audio
    direction: one-way
    transport: custom
    customTransport: audio input
    delivery: pull
    description: Captured only while the dictation hotkey is held. Release the key and the stream stops.
    condition: the dictation hotkey is held
    meta:
      format: raw PCM, converted to 16 kHz mono as it arrives
    provenance:
      source: human
      author: max

  - from: device.macos
    to: typemeit.read-back
    payload: field contents
    direction: one-way
    transport: custom
    customTransport: accessibility api
    delivery: pull
    description: Reads back the field the text landed in, so a fix you make by hand can be compared with what was pasted.
    condition: learning from corrections is on, and the paste landed in a text field
    frequency: four times a second, for up to 90 seconds after a paste
    provenance:
      source: human
      author: max

  - from: device.macos.apple-intelligence
    to: typemeit.post-processor
    payload: tidied text
    direction: one-way
    transport: custom
    customTransport: in process
    delivery: push
    description: The model's answer as it comes back. A run that fails or is cancelled returns nothing, and the text carries on without it.
    provenance:
      source: human
      author: max

  - from: external.github
    to: typemeit.transcriber.parakeet-gguf
    payload: speech model
    direction: one-way
    transport: http
    delivery: pull
    description: Downloaded once while the app is being set up, then used from disk. The app never talks to GitHub during a dictation.
    frequency: once, during onboarding
    transform: checked against a size and a SHA-256 fingerprint before it is put in place
    meta:
      size: 697 MB
      format: GGUF, Q8_0 quantised
      source: github.com/typemeit/typemeit/releases ↗
    provenance:
      source: human
      author: max

  - from: external.github
    to: typemeit.updater
    payload: appcast.xml
    direction: one-way
    transport: http
    delivery: pull
    description: The list of released versions. The app asks; nothing about the Mac is sent with the request.
    frequency: hourly, and at launch
    meta:
      feed: github.com/typemeit/typemeit/releases/latest/download/appcast.xml ↗
      signature: EdDSA, checked against a public key shipped in the app
    provenance:
      source: human
      author: max

  - from: external.github
    to: typemeit.updater
    payload: signed DMG
    direction: one-way
    transport: http
    delivery: pull
    description: The new build itself, fetched when the feed advertises a newer version than the one running. It is put in place on the next relaunch.
    condition: a newer version exists, and a dictation is not in flight
    provenance:
      source: human
      author: max

  - from: typemeit.audio-capture
    to: typemeit.recordings
    payload: raw recording
    direction: one-way
    transport: file
    delivery: push
    description: The take is archived so the dictation can be played back beside its transcript later. Off by default.
    condition: keeping the audio is switched on
    transform: encoded to AAC, mono, 16 kbps
    provenance:
      source: human
      author: max

  - from: typemeit.audio-capture
    to: typemeit.transcriber
    payload: 16 kHz audio
    direction: one-way
    transport: custom
    customTransport: in process
    delivery: push
    description: The whole take, already in the format the model expects, handed over when the hotkey is released.
    condition: the take is longer than 0.3 s and not silent
    transform: downsampled to 16 kHz mono
    provenance:
      source: human
      author: max

  - from: typemeit.custom-word-matcher
    to: typemeit.post-processor
    payload: matched transcript
    direction: one-way
    transport: custom
    customTransport: in process
    delivery: push
    description: The transcript with your vocabulary already restored, on its way into grammar clean-up.
    condition: Apple Intelligence clean-up is switched on
    provenance:
      source: human
      author: max

  - from: typemeit.learned-words-json
    to: typemeit.custom-word-matcher
    payload: learned terms
    direction: one-way
    transport: file
    delivery: pull
    description: What the model misheard last time is loaded back as a spelling it should recognise this time. This is the loop that makes a correction stick.
    frequency: every dictation
    provenance:
      source: human
      author: max

  - from: typemeit.local-cleanup
    to: device.macos
    payload: final text
    direction: one-way
    transport: custom
    customTransport: system clipboard
    delivery: push
    description: |-
      The finished dictation leaves the app and lands where you were typing.
      - it is put on the system clipboard and a Cmd+V keystroke is posted for you
      - whatever the clipboard held before is put back once the app you pasted into has read it
      - if nothing readable had focus, or nothing ever read the clipboard, the text is offered as
        a copy button instead
      For that moment the transcript sits on the system clipboard, where any clipboard manager on
      the Mac can see it.
    meta:
      via: system clipboard
      mechanism: Cmd+V posted as a synthetic keystroke, which needs Accessibility permission
    provenance:
      source: human
      author: max

  - from: typemeit.local-cleanup
    to: typemeit.history-json
    payload: history entry
    direction: one-way
    transport: file
    delivery: push
    description: |-
      The dictation is written to the local history file: what the model heard, the tidied
      version, which app and window it went to, and how long each stage took. This is where
      personal data comes to rest. Note that the exact characters pasted are not kept — the
      record is written from the text before the last clean-up pass.
    frequency: every dictation
    provenance:
      source: human
      author: max

  - from: typemeit.post-processor
    to: device.macos.apple-intelligence
    payload: transcript to tidy
    direction: one-way
    transport: custom
    customTransport: in process
    delivery: push
    description: The rules are given to the model up front and the transcript alone is sent as the message, so it edits rather than answers.
    condition: Apple Intelligence clean-up is switched on
    provenance:
      source: human
      author: max

  - from: typemeit.post-processor
    to: typemeit.local-cleanup
    payload: cleaned draft
    direction: one-way
    transport: custom
    customTransport: in process
    delivery: push
    description: The tidied text still goes through the mechanical pass, because the model often leaves fillers alone. When its answer was rejected, or it never ran, the matched transcript takes this path instead.
    provenance:
      source: human
      author: max

  - from: typemeit.read-back
    to: typemeit.learned-words-json
    payload: corrected words
    direction: one-way
    transport: file
    delivery: push
    description: A fix you made by hand is saved as a pair — what was heard, what you meant — so the same mistake stops happening.
    condition: the fix is a name, product, project, acronym or technical term
    provenance:
      source: human
      author: max

  - from: typemeit.read-back
    to: typemeit.settings
    payload: learned word
    direction: one-way
    transport: db-write
    delivery: push
    description: The learned spelling is also added to your custom words, which is the list the matcher and the clean-up model actually read. Undoing it removes it again and blocks it from ever being learned a second time.
    provenance:
      source: human
      author: max

  - from: typemeit.settings
    to: typemeit.audio-capture
    payload: microphone choice
    direction: one-way
    transport: db-read
    delivery: pull
    description: Which microphone to open. Empty means whatever the Mac is using by default.
    frequency: every dictation
    provenance:
      source: human
      author: max

  - from: typemeit.settings
    to: typemeit.custom-word-matcher
    payload: custom terms
    direction: one-way
    transport: db-read
    delivery: pull
    description: Your hand-entered vocabulary — names, jargon, product spellings — read fresh on every dictation so the matcher can protect it.
    frequency: every dictation
    provenance:
      source: human
      author: max

  - from: typemeit.settings
    to: typemeit.post-processor
    payload: terms to keep
    direction: one-way
    transport: db-read
    delivery: pull
    description: Only the custom terms the transcript already contains are named to the clean-up model, so it leaves them alone. It is never shown the whole list — given that, it swapped one listed word for another.
    provenance:
      source: human
      author: max

  - from: typemeit.settings
    to: typemeit.updater
    payload: update preferences
    direction: one-way
    transport: db-read
    delivery: pull
    description: |-
      Two preferences decide how an update arrives.
      - auto update: whether the app checks and downloads on its own at all
      - ask before updating: whether it waits for your click before putting the new build in place
      Both are on by default. With auto update off, the updater neither checks on a schedule nor
      downloads in the background.
    meta:
      read at: Updates.swift · 65, 169, 174, 222, 269, 279
    provenance:
      source: human
      author: max

  - from: typemeit.transcriber
    to: typemeit.custom-word-matcher
    payload: raw transcript
    direction: one-way
    transport: custom
    customTransport: in process
    delivery: push
    description: What the model heard, one word at a time with a score attached to each, before any correction is applied.
    provenance:
      source: human
      author: max

  - from: typemeit.transcriber.parakeet-gguf
    to: typemeit.transcriber.transcribe
    payload: model weights
    direction: one-way
    transport: file
    delivery: pull
    description: The model file is loaded into the running app on first use and freed again after five idle minutes, so an app left open does not hold 697 MB forever.
    meta:
      size: 697 MB
    provenance:
      source: human
      author: max

  - from: typemeit.transcriber.transcribe
    to: typemeit.transcriber.word-scoring
    payload: token probabilities
    direction: one-way
    transport: custom
    customTransport: in process
    delivery: push
    description: The model emits a score for every piece of every word; those are what the per-word number is folded from.
    provenance:
      source: human
      author: max
