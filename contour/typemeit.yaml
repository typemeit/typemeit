  - from: typemeit.local-cleanup
    to: device.macos
    payload: final text
    direction: one-way
    transport: custom
    customTransport: system clipboard
    delivery: push
    description: |-
      The finished dictation leaves the app and lands where you were typing.
      - it is put on the system clipboard and a Cmd+V keystroke is posted for you
      - whatever the clipboard held before is put back once the app you pasted into has read it
      - if nothing readable had focus, or nothing ever read the clipboard, the text is offered as
        a copy button instead
      For that moment the transcript sits on the system clipboard, where any clipboard manager on
      the Mac can see it.
    pii: true
    meta:
      via: system clipboard
      mechanism: Cmd+V posted as a synthetic keystroke, which needs Accessibility permission
    provenance:
      state: asserted
      source: human
      author: max
      evidence:
        repo: typemeit
        file: TypeMeIt/Output.swift
        lines: [92, 129]
        blob: e25d6ae1897f2af960230c543b4dfccee49b8727

  - from: typemeit.local-cleanup
    to: typemeit.history-json
    payload: history entry
    direction: one-way
    transport: file
    delivery: push
    description: |-
      The dictation is written to the local history file: what the model heard, the tidied
      version, which app and window it went to, and how long each stage took. This is where
      personal data comes to rest. Note that the exact characters pasted are not kept — the
      record is written from the text before the last clean-up pass.
    pii: true
    frequency: every dictation
    provenance:
      state: asserted
      source: human
      author: max
      evidence:
