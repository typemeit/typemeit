  - from: typemeit.local-cleanup
    to: device.macos
    payload: final text
    direction: one-way
    transport: custom
    customTransport: system clipboard
    delivery: push
    description: |-
      The finished dictation leaves the app and lands where the user was typing.
      - the text is put on the system clipboard and a Cmd+V keystroke is posted
      - whatever the clipboard held before is restored once the target app has read the
        text
      - if nothing readable had focus, or nothing read the clipboard, the text is offered
        as a copy button instead
      While it is on the clipboard, any clipboard manager on the Mac can read the
      transcript.
    pii: true
    meta:
      via: system clipboard
      mechanism: Cmd+V posted as a synthetic keystroke, which needs Accessibility permission
    provenance:
      state: asserted
      source: human
      author: max
      evidence:
        repo: typemeit
        file: TypeMeIt/Output.swift
        lines: [92, 129]
        blob: e25d6ae1897f2af960230c543b4dfccee49b8727

  - from: typemeit.local-cleanup
