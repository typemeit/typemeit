nodes:
  - key: device.macos
    kind: device
    name: macOS
    summary: Mic audio in; pasted text out.
    description: |-
      The Mac itself — the boundary where your data enters and leaves the app.
      - microphone audio comes in, while the dictation hotkey is held
      - the finished text goes back out, pasted where you were typing
      - the field you pasted into is read back afterwards, so your hand-fixes can be learned
    provenance:
      state: asserted
      source: human
      author: max
