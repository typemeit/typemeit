nodes:
  - key: device.macos
    kind: device
    name: macOS
    summary: Mic audio in; pasted text out.
    description: |-
      The Mac itself — the boundary where your data enters and leaves the app.
      - microphone audio comes in, while the dictation hotkey is held
      - the finished text goes back out, pasted where you were typing
      - the field you pasted into is read back afterwards, so your hand-fixes can be learned
    provenance:
      source: human
      author: max

  - key: device.macos.apple-intelligence
    kind: service
    name: Apple Intelligence
    summary: The Mac's own language model; it fixes a transcript's grammar and punctuation and hands it back.
    meta:
      framework: Apple FoundationModels
    description: |-
      The language model that ships with macOS, running as part of the operating system.
      - it runs on this Mac: the transcript goes to it and comes back without leaving the machine
      - nothing is sent over the network, and no account is involved
      - a Mac without Apple Intelligence does not have it, and the app carries on without it
    provenance:
      source: human
      author: max
