<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" data-plotter="" data-plotter-unit="16" fill="none" stroke="currentColor" stroke-linecap="butt" stroke-linejoin="round" style="font-family:Cal Sans,sans-serif;font-optical-sizing:auto;font-synthesis:none;font-variation-settings:'GEOM' 25;font-weight:400" role="img" aria-labelledby="voices-title voices-desc">
  <title id="voices-title">One recording, two voices</title>
  <desc id="voices-desc">A recording is cut into five turns. Each turn drops into the lane of the voice that spoke it, keeping its length and its place in time.</desc>
  <metadata>Conceptual diagram of speaker diarization. Unit u=16. Recording x144–464 = 20u, turns 6+3+2+5+4u. Lanes keep each turn's x exactly; projections are the turn edges, stopped 8 units short of lane 1's forms. Amplitude bars sit 4 units inside every turn edge at an 8-unit pitch and are copied unchanged into the lanes: the same audio, re-sorted. Borrowed from “One task, two agents”: one whole partitioned, its parts projected down with widths kept.</metadata>
